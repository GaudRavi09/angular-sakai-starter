<ul class="layout-menu">
  @for (menu of menus; track $index) {
    <!-- show menu -->
    @if (!menu.separator) {
      <li app-menuitem [item]="menu" [index]="$index" [root]="true"></li>
    }

    <!-- show seprator -->
    @if (menu.separator) {
      <li class="menu-separator"></li>
    }
  }
</ul>
