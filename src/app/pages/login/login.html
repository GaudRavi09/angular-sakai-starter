<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
  <div class="flex flex-col items-center justify-center">
    <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20 flex flex-col items-center" style="border-radius: 53px">
      <!-- header -->
      <div class="text-center mb-8">
        <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">Welcome to Angular!</div>
        <span class="text-muted-color font-medium">Sign in to continue</span>
      </div>

      <div class="md:w-120">
        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <!-- email input -->
          <email-input />

          <!-- password input -->
          <div class="py-3">
            <password-input />
          </div>

          <!-- forgot password -->
          <div class="flex items-center justify-end mt-2 mb-8">
            <span class="cursor-pointer text-primary">Forgot password?</span>
          </div>

          <!-- login button -->
          <p-button size="large" label="Login" routerLink="/" styleClass="w-full" />
        </form>
      </div>
    </div>
  </div>
</div>
