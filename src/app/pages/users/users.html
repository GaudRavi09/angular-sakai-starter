<p-toolbar class="mb-6">
  <ng-template #start>
    <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" routerLink="/users/add" />

    <p-button outlined label="Delete" icon="pi pi-trash" severity="secondary" />
  </ng-template>

  <ng-template #end>
    <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
  </ng-template>
</p-toolbar>

<!-- user list -->
<user-list />

<!-- confirm dialog -->
<p-confirmdialog [style]="{ width: '450px' }" />
