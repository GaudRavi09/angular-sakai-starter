<div class="mb-2">
  <!-- label -->
  @if (label()) {
    <label class="block mb-2" [for]="controlName()">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }

  <!-- input -->
  <p-iconField>
    @if (showIcon()) {
      <p-inputIcon class="pi pi-envelope" />
    }

    <input
      pInputText
      type="email"
      class="w-full"
      [id]="controlName()"
      [readonly]="readonly()"
      [attr.inputmode]="'email'"
      [invalid]="isControlInvalid"
      [placeholder]="getPlaceholder"
      (keydown)="preventSpace($event)"
      [formControlName]="controlName()"
      (input)="formatEmailInput($event)"
    />
  </p-iconField>

  <!-- validation -->
  @if (isControlInvalid) {
    <small class="block text-red-500 mt-1">*Please enter the {{ label().toLowerCase() }}. </small>
  }
</div>
