<div class="mb-4">
  <!-- label -->
  @if (label()) {
    <label class="block text-surface-900 dark:text-surface-0 mb-1" [for]="controlName()">
      {{ label() }}
      @if (required()) {
        <span class="text-red-700">*</span>
      }
    </label>
  }

  <!-- input -->
  <p-iconField>
    @if (showIcon()) {
      <p-inputIcon class="pi pi-envelope" />
    }

    <input
      pInputText
      type="email"
      class="w-full"
      [id]="controlName()"
      [readonly]="readonly()"
      (input)="onInput($event)"
      [attr.inputmode]="'email'"
      [invalid]="isControlInvalid"
      [placeholder]="getPlaceholder"
      [formControlName]="controlName()"
    />
  </p-iconField>

  <!-- validation -->
  @if (isControlInvalid) {
    <small class="block text-red-700 mt-1">*Please enter the valid {{ label().toLowerCase() }}. </small>
  }
</div>
