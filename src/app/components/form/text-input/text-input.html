<div class="mb-2">
  <!-- label -->
  @if (label()) {
    <label class="block mb-2" [for]="controlName()">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }

  <!-- input -->
  <p-iconField>
    @if (iconName()) {
      <p-inputIcon [class]="'pi' + iconName" />
    }

    <input
      pInputText
      class="w-full"
      [id]="controlName()"
      [readOnly]="readonly()"
      [invalid]="isControlInvalid"
      [placeholder]="getPlaceholder"
      [formControlName]="controlName()"
    />
  </p-iconField>

  <!-- validation -->
  @if (isControlInvalid) {
    <small class="block text-red-500 mt-1">*Please enter the {{ label().toLowerCase() }}. </small>
  }
</div>
